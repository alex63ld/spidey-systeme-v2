<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER SYSTEM — Sport, Nutrition, Budget & Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a12;
    --panel:#111119;
    --line:#26233a;
    --red:#e2231a;
    --blue:#1e6fff;
    --text:#f2f0f2;
    --muted:#8b87a3;
    --pixel:'Press Start 2P','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--pixel);}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .hub-head{
    padding:10px 14px 8px;
    background:linear-gradient(180deg,#0d0d16,#0a0a12);
    border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .hub-head .logo{font-size:12px;letter-spacing:.03em;color:var(--red);text-shadow:2px 2px 0 var(--line);}
  .hub-head .logo span{color:var(--blue);}
  .hub-head .sub{font-size:7px;color:var(--muted);letter-spacing:.03em;margin-top:4px;flex-basis:100%;}

  .sheet-tabs{
    display:flex;gap:2px;background:#050508;padding:8px 10px 0;border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  .sheet-tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    color:var(--muted);
    font-family:var(--pixel);
    font-size:9px;
    letter-spacing:.02em;
    padding:11px 16px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s;
    position:relative;
    top:2px;
  }
  .sheet-tab:hover{color:var(--text);}
  .sheet-tab.active{
    background:var(--bg);
    color:var(--text);
    border-color:var(--red);
    box-shadow:0 -2px 14px rgba(226,35,26,.25);
  }
  .sheet-tab.active[data-sheet="macro"]{ border-color:var(--blue); box-shadow:0 -2px 14px rgba(30,111,255,.3); }
  .sheet-tab.active[data-sheet="budget"]{ border-color:#2fce6e; box-shadow:0 -2px 14px rgba(47,206,110,.3); }
  .sheet-tab.active[data-sheet="almanach"]{ border-color:#f2b705; box-shadow:0 -2px 14px rgba(242,183,5,.3); }

  .sheet-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;}
  .sheet-tab[data-sheet="macro"] .dot{background:var(--blue);}
  .sheet-tab[data-sheet="budget"] .dot{background:#2fce6e;}
  .sheet-tab[data-sheet="almanach"] .dot{background:#f2b705;}

  .frames{flex:1;position:relative;min-height:0;}
  .frame-wrap{position:absolute;inset:0;display:none;}
  .frame-wrap.active{display:block;}
  .frame-wrap iframe{width:100%;height:100%;border:none;display:block;background:var(--bg);}
  .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:9px;letter-spacing:.04em;background:var(--bg);
  }

  .sheet-strip{
    display:flex;gap:4px;padding:6px 10px;background:#050508;border-top:2px solid var(--line);
    overflow-x:auto;
  }
  .sheet-strip button{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-family:var(--pixel);font-size:7.5px;padding:7px 12px;border-radius:5px;cursor:pointer;
  }
  .sheet-strip button.active{background:var(--red);color:#0a0a0f;border-color:var(--red);}
  .sheet-strip button[data-sheet="macro"].active{background:var(--blue);border-color:var(--blue);}
  .sheet-strip button[data-sheet="budget"].active{background:#2fce6e;border-color:#2fce6e;color:#06210f;}
  .sheet-strip button[data-sheet="almanach"].active{background:#f2b705;border-color:#f2b705;color:#241c00;}
</style>
</head>
<body>

  <div class="hub-head">
    <div class="logo">🕷 SPIDER SYSTEM <span>HUB</span></div>
    <div class="sub">Un seul fichier — quatre feuilles, comme dans un classeur Excel</div>
  </div>

  <div class="sheet-tabs">
    <div class="sheet-tab active" data-sheet="sport"><span class="dot"></span>Feuille 1 — Sport</div>
    <div class="sheet-tab" data-sheet="macro"><span class="dot"></span>Feuille 2 — Macros</div>
    <div class="sheet-tab" data-sheet="budget"><span class="dot"></span>Feuille 3 — Budget</div>
    <div class="sheet-tab" data-sheet="almanach"><span class="dot"></span>Feuille 4 — Almanach Courses</div>
  </div>

  <div class="frames">
    <div class="frame-wrap active" id="wrap-sport">
      <div class="loading" id="loading-sport">Chargement…</div>
      <iframe id="iframe-sport" title="Sport Tracker"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-macro">
      <div class="loading" id="loading-macro">Chargement…</div>
      <iframe id="iframe-macro" title="Macro Tracker"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-budget">
      <div class="loading" id="loading-budget">Chargement…</div>
      <iframe id="iframe-budget" title="Budget"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-almanach">
      <div class="loading" id="loading-almanach">Chargement…</div>
      <iframe id="iframe-almanach" title="Almanach Courses & Repas"></iframe>
    </div>
  </div>

  <div class="sheet-strip">
    <button class="active" data-sheet="sport">🕷 Sport</button>
    <button data-sheet="macro">🍽 Macros</button>
    <button data-sheet="budget">💰 Budget</button>
    <button data-sheet="almanach">🛒 Courses</button>
  </div>

function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}

const SRC = { sport: SPORT_B64, macro: MACRO_B64, budget: BUDGET_B64, almanach: ALMANACH_B64 };
const loaded = { sport: false, macro: false, budget: false, almanach: false };

function loadSheet(name){
  if(loaded[name]) return;
  const iframe = document.getElementById('iframe-'+name);
  const loading = document.getElementById('loading-'+name);
  iframe.addEventListener('load', ()=>{ if(loading) loading.style.display='none'; }, { once:true });
  iframe.srcdoc = b64DecodeUnicode(SRC[name]);
  loaded[name] = true;
}

function showSheet(name){
  document.querySelectorAll('.frame-wrap').forEach(el=>el.classList.remove('active'));
  document.getElementById('wrap-'+name).classList.add('active');

  document.querySelectorAll('.sheet-tab').forEach(el=>el.classList.toggle('active', el.dataset.sheet===name));
  document.querySelectorAll('.sheet-strip button').forEach(el=>el.classList.toggle('active', el.dataset.sheet===name));

  loadSheet(name);
}

document.querySelectorAll('.sheet-tab, .sheet-strip button').forEach(el=>{
  el.addEventListener('click', ()=>showSheet(el.dataset.sheet));
});

loadSheet('sport');
</script>
